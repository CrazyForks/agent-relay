name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  codex-contract-minimum:
    name: Codex contract (0.145.0)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install minimum Codex CLI
        run: npm install --global @openai/codex@0.145.0

      - name: Verify app-server contract
        run: bun run test:codex-contract

  codex-contract-pinned:
    name: Codex contract (0.159.2)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install assessed Codex CLI
        run: npm install --global @openai/codex@0.159.2

      - name: Verify pinned experimental app-server contract
        env:
          CODEX_CONTRACT_EXPECT_VERSION: "0.159.2"
        run: bun run test:codex-contract

      - name: Verify native Gateway browser boundary
        env:
          CODEX_CONTRACT_EXPECT_VERSION: "0.159.2"
        run: bun run test:codex-gateway-boundary

  codex-contract-latest:
    name: Codex contract (latest)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install latest Codex CLI
        run: npm install --global @openai/codex@latest

      - name: Verify app-server contract
        run: bun run test:codex-contract
